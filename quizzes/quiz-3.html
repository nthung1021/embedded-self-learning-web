var Q=[

[13,"TimingEvent kích hoạt runnable theo cách nào?","Theo chu kỳ thời gian cố định","Khi có ngắt bus-off","Khi ECU được nạp phần mềm","Chỉ một lần khi ECU tắt","TimingEvent chạy runnable định kỳ, ngoài ra còn các event như DataReceivedEvent và OperationInvokedEvent."],

[14,"Exclusive Area trong RTE dùng để làm gì?","Bảo vệ truy cập dữ liệu dùng chung giữa các runnable","Chọn baud-rate cho CAN","Khởi tạo clock","Sinh file ARXML","Runnable vào vùng bảo vệ bằng Rte_Enter và rời đi bằng Rte_Exit để tránh xung đột dữ liệu."],

[21,"Dio, Port, Adc và Pwm thuộc nhóm driver nào trong MCAL?","I/O drivers","Communication drivers","Memory drivers","Microcontroller drivers","Đây là các driver cho ngõ vào/ra số, chân, ADC và PWM."],
[21,"Module nào dùng để đọc và ghi mức logic của một chân đã cấu hình?","Dio","Port","Mcu","CanIf","Port cấu hình chức năng và chiều của chân; Dio đọc hoặc ghi mức logic."],

var f=document.getElementById('quiz'),btn=f.querySelector('button');
Q.forEach(function(d,i){
  var pos=(i*3+(i>>1)+2)%4, o=d.slice(2,6), c=o.shift();
  o.splice(pos,0,c);
  var fs=document.createElement('fieldset');
  fs.className='q';
  fs.dataset.correct='abcd'[pos];
  fs.dataset.explain=d[6];
  var h='<legend>Câu '+(i+1)+' (Bài '+d[0]+'): '+d[1]+'</legend>';
  o.forEach(function(t,k){
    h+='<label><input type="radio" name="q'+i+'" value="'+'abcd'[k]+'"> '+t+'</label>';
  });
  fs.innerHTML=h+'<p class="fb"></p>';
  f.insertBefore(fs,btn);
});
</script>
